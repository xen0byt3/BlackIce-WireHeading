<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Compass: Kali Linux Command Lab Cheat Sheet | Black Ice WireHeading</title>

<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#050a12;--pn:#0b1522;--ln:#17324b;--ac:#00d4ff;--ice:#9ff0ff;--tx:#d8e8f6;--mu:#8aa3b8;--ok:#3be39a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* splash */
#sp{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a1c2e 0%,#050a12 72%);overflow:hidden;transition:opacity .8s,transform .8s}
#sp.out{opacity:0;transform:scale(1.05);pointer-events:none}
#rain{position:absolute;inset:0;opacity:.32}
#sp::after{content:"";position:absolute;left:0;right:0;top:-140px;height:140px;background:linear-gradient(transparent,rgba(0,212,255,.14),transparent);animation:sweep 4.5s linear infinite}
@keyframes sweep{to{top:100%}}
.cn{position:absolute;width:44px;height:44px;border:2px solid var(--ac);opacity:.7;animation:blink 2.4s ease-in-out infinite}
.cn.a{top:22px;left:22px;border-right:0;border-bottom:0}.cn.b{top:22px;right:22px;border-left:0;border-bottom:0}
.cn.c{bottom:22px;left:22px;border-right:0;border-top:0}.cn.d{bottom:22px;right:22px;border-left:0;border-top:0}
@keyframes blink{50%{opacity:.25}}
.in{position:relative;z-index:2;text-align:center;padding:20px;width:min(580px,94vw)}
.logo{width:min(210px,48vw);filter:drop-shadow(0 0 18px rgba(0,212,255,.65));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sp1,.sp2,.core{transform-box:fill-box;transform-origin:center}
.sp1{animation:spin 18s linear infinite}.sp2{animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.wire{stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.core{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.13);opacity:.72}}
h1.gl{position:relative;font:800 clamp(24px,6vw,42px)/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--ice);margin:14px 0 6px;text-shadow:0 0 18px rgba(0,212,255,.7);animation:flick 5s infinite}
h1.gl::before,h1.gl::after{content:attr(data-text);position:absolute;left:0;right:0;top:0;overflow:hidden;clip-path:inset(0 0 100% 0)}
h1.gl::before{color:#ff2e88;transform:translateX(-3px);animation:g1 2.6s infinite steps(1)}
h1.gl::after{color:#00ffd5;transform:translateX(3px);animation:g2 2.2s infinite steps(1)}
@keyframes g1{0%,88%,100%{clip-path:inset(0 0 100% 0)}90%{clip-path:inset(10% 0 55% 0)}94%{clip-path:inset(45% 0 25% 0)}}
@keyframes g2{0%,80%,100%{clip-path:inset(0 0 100% 0)}82%{clip-path:inset(60% 0 10% 0)}86%{clip-path:inset(20% 0 60% 0)}}
@keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.7}96%{opacity:1}97%{opacity:.82}}
.by{color:var(--mu);letter-spacing:.28em;font-size:12px}
.by b{color:var(--ac)}
.sub{margin:16px 0 20px;font-size:15px}
.bar{height:12px;border:1px solid var(--ln);border-radius:8px;background:#06111d;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#0077ff,var(--ac),var(--ice));box-shadow:0 0 14px var(--ac);position:relative;overflow:hidden}
#fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shim 1.4s linear infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stat{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mu)}
/* app */
#app{display:none}#app.on{display:block;animation:fi .6s}
@keyframes fi{from{opacity:0}}
header{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(8,16,28,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.br{font-weight:700;color:var(--ice);white-space:nowrap}.br small{color:var(--mu);font-weight:400}
#mn{display:none;background:none;border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
#q{flex:1;max-width:580px;background:#071220;border:1px solid var(--ln);color:var(--tx);padding:10px 14px;border-radius:10px;font:inherit}
#pg{font-size:13px;color:var(--ok);white-space:nowrap}
.lay{display:grid;grid-template-columns:268px 1fr}
nav{border-right:1px solid var(--ln);padding:12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--pn)}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px}
nav button:hover{background:#10243a}nav .on{background:#0e3552;color:var(--ice)}
nav .n{min-width:22px;color:var(--ac);font-family:ui-monospace,monospace;font-size:13px}
nav .dn{margin-left:auto;color:var(--ok);font-style:normal}
main{padding:26px clamp(14px,3vw,38px) 60px;max-width:1020px;width:100%}
h2{font-size:26px;line-height:1.25;color:var(--ice);margin-bottom:6px}
h3{font-size:17px;margin:22px 0 8px;color:var(--ice)}
.g{color:var(--mu);margin-bottom:10px;max-width:70ch}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin:14px 0;overflow:hidden}
.cb{position:relative;background:#030810;border-bottom:1px solid var(--ln)}
pre{padding:14px 84px 14px 14px;overflow-x:auto;color:#aef0ff;font-size:13.5px;line-height:1.5}
.cp{position:absolute;top:8px;right:8px;background:#0e3552;border:1px solid var(--ln);border-radius:8px;padding:4px 12px;font-size:12px}
.cp:hover{background:var(--ac);color:#031018}
.cd p{padding:12px 14px;max-width:80ch}
mark{background:#ffd54a;color:#111;border-radius:3px;padding:0 2px}
.ck{border-left:3px solid var(--ok);background:#0a1f1a;padding:10px 14px;border-radius:0 8px 8px 0;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:12px 0}
.tile{text-align:left;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.tile:hover{border-color:var(--ac)}.tile b{display:block;color:var(--ice)}.tile span{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{background:#071220;border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font:13px ui-monospace,monospace;color:var(--ice)}
.chips button:hover{border-color:var(--ac)}
.st{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.st div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 18px}
.st b{font-size:24px;color:var(--ac);display:block}
table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{border:1px solid var(--ln);padding:8px 12px;text-align:left;vertical-align:top}th{background:#0e2236}
ul,ol{padding-left:22px;margin:8px 0}li{margin:4px 0}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.nv button,.dnb,.go{background:#0e3552;border:1px solid var(--ln);border-radius:10px;padding:9px 16px}
.nv button:hover,.dnb:hover,.go:hover{border-color:var(--ac)}
.tag{font-size:12px;color:var(--ac)}
.dnb.d{background:#0a2a22;border-color:var(--ok);color:var(--ok)}
@media(max-width:820px){.lay{grid-template-columns:1fr}#mn{display:block}.br small{display:none}
nav{position:fixed;left:-290px;top:58px;width:280px;z-index:20;transition:left .25s}nav.open{left:0}}
@media(prefers-reduced-motion:reduce){.logo,.sp1,.sp2,.wire,.core,h1.gl,.cn,#sp::after,#fill::after{animation:none}}
/* v2 overrides */
body{background:radial-gradient(1100px 520px at 85% -8%,#0a2540 0%,transparent 62%) fixed,radial-gradient(800px 500px at -10% 110%,#08261f 0%,transparent 60%) fixed,#050a12}
/* splash v2 */
#sp .in{width:min(900px,96vw)}
.rd{position:relative;display:inline-block;padding:18px}
.rd::before,.rd::after{content:"";position:absolute;inset:-34px;border-radius:50%;-webkit-mask:radial-gradient(circle,#000 60%,transparent 71%);mask:radial-gradient(circle,#000 60%,transparent 71%)}
.rd::before{background:conic-gradient(from 0deg,rgba(0,255,156,.5),rgba(0,255,156,0) 30%);animation:spin 3.6s linear infinite}
.rd::after{background:repeating-radial-gradient(circle,transparent 0 24px,rgba(0,212,255,.28) 25px 26px)}
.rd .logo{position:relative;z-index:1;width:min(250px,50vw)}
h1.gl{font:900 clamp(22px,6vw,64px)/1.05 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;white-space:nowrap;color:#e9fcff;margin:18px 0 8px;text-shadow:0 0 6px #00d4ff,0 0 22px #00d4ff,0 0 48px rgba(0,212,255,.65)}
.by{font-size:14px;letter-spacing:.4em;font-weight:700}
.sub{font-size:clamp(13px,2.2vw,18px);color:var(--ice);letter-spacing:.04em;margin:14px 0 22px}
.bar{height:16px;border-radius:4px;background:repeating-linear-gradient(90deg,#06111d 0 14px,#0b1c2e 14px 15px)}
.tp{position:absolute;top:26px;left:80px;right:80px;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mu);letter-spacing:.14em;z-index:3}
.tp b{color:#00ff9c;animation:blink 1.6s steps(2) infinite}
#log{position:absolute;left:30px;bottom:30px;width:min(380px,34vw);font-size:12px;line-height:1.6;color:#6dff9f;text-align:left;z-index:3;text-shadow:0 0 6px rgba(0,255,156,.5)}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fi .3s}
#log i{color:#00d4ff;font-style:normal}
#sp.acc .in{animation:flash .5s}
@keyframes flash{50%{filter:brightness(1.7)}}
#sp.acc #msg{color:#00ff9c;font-weight:700;letter-spacing:.2em}
@media(max-width:760px){#log{display:none}.tp{left:20px;right:20px;top:20px;font-size:10px}.tp span:last-child{display:none}.by{letter-spacing:.2em}}
/* app v2 */
header{height:60px;padding:0 16px}
#pb{position:sticky;top:60px;z-index:9;height:3px;background:#0b1c2e}
#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00ff9c,#00d4ff);box-shadow:0 0 10px #00d4ff;transition:width .5s}
nav{top:63px;height:calc(100vh - 63px)}
main h2{font-size:30px}
.tile{transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-2px)}
.sp-row{display:flex;gap:6px;margin:12px 0 4px}
.sp-row i{flex:1;height:6px;border-radius:4px;background:#12283f}
.sp-row i.p{background:var(--ok)}.sp-row i.c{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.tb{display:flex;gap:14px;border:1px solid #1d5a46;background:linear-gradient(135deg,#0a2a22,#0a1a2a);border-radius:14px;padding:14px 16px;margin:16px 0}
.tb .ic{font:700 22px ui-monospace,monospace;color:#6dff9f;border:1px solid #1d5a46;border-radius:8px;padding:2px 10px;height:max-content}
.tb b{color:#6dff9f}.tb.sm{padding:8px 12px;font-size:13px;margin:10px 0 16px}.tb.sm .ic{font-size:14px;padding:0 8px}
/* command cards */
.cd{border-radius:14px;transition:border-color .2s,box-shadow .2s}
.cd:hover{border-color:#1f5a7a;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#0f2740,#0b1c30);border-bottom:1px solid var(--ln);font-size:12px}
.ch::before{content:"";width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 0 #febc2e,32px 0 0 #28c840;margin-right:34px;flex:none}
.sn{color:var(--ac);font-weight:700;white-space:nowrap}
.pr{color:#6dff9f;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lk{border-radius:20px;padding:2px 10px;font-size:11px;border:1px solid #5a3a1a;color:#ffb35c;background:#2a1a08;white-space:nowrap}
.lk.ok{border-color:#1a5a3a;color:#6dff9f;background:#08241a}
.cp{position:static;padding:3px 12px}
.cb{background:#02060d;border-bottom:0}
pre{padding:16px 18px;color:#e6f1ff;font-size:14px}
.nc,.nc *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kc{color:#6dff9f;font-weight:700}.kf{color:#ffd166}.ks{color:#ff9de2}.kv{color:#c3a6ff}.ko{color:#ff5c8a;font-weight:700}.kp{color:#5fd7ff}.kk{color:#6b8299;font-style:italic}
/* quiz */
.qz{margin:28px 0 8px;border:1px solid var(--ln);border-radius:16px;padding:18px;background:linear-gradient(180deg,#0b1a2c,#08121f)}
.qz h3{margin:0}
.qs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qp{height:6px;background:#0b1c2e;border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.qp i{display:block;height:100%;background:linear-gradient(90deg,#00ff9c,#00d4ff);transition:width .4s}
.qb{margin:18px 0 0}.qq{font-weight:600;margin-bottom:6px}
.qo{display:flex;gap:10px;width:100%;text-align:left;background:#071220;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;margin:6px 0}
.qo:hover:not(:disabled){border-color:var(--ac);background:#0b2236}
.qo b{color:var(--ac);min-width:18px}
.qo.ok{border-color:var(--ok);background:#0a2a22;color:#b8ffdd}
.qo.bad{border-color:#ff5c8a;background:#2a0f1a;color:#ffb3c6}
.qo:disabled{cursor:default}
.qm{font-size:13px;min-height:20px}.qm.ok{color:var(--ok)}.qm.bad{color:#ff8fb0}
.nv button:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
nav .lkd{opacity:.55}.tile.lkd{opacity:.6}
nav .rs{margin-top:14px;font-size:13px;color:var(--mu);border:1px dashed var(--ln)}
.ts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0e3552;border:1px solid var(--ac);padding:10px 18px;border-radius:10px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fi .2s;max-width:92vw}
/* v3 overrides */
html{scrollbar-color:#17324b #050a12}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#17324b;border-radius:8px}
main>*{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.hero,.ph{position:relative;overflow:hidden;border:1px solid var(--ln);border-radius:18px;padding:22px 24px;margin-bottom:16px;background:radial-gradient(520px 220px at 100% 0,rgba(0,212,255,.2),transparent 70%),linear-gradient(135deg,#0c2036,#08131f)}
.hero h2{font-size:32px;margin:4px 0 8px}
.ph{display:flex;gap:20px;align-items:center}
.ph h2{margin:2px 0 6px}
.pn{font:900 72px/1 ui-monospace,monospace;color:transparent;-webkit-text-stroke:2px var(--ac);opacity:.85;text-shadow:0 0 24px rgba(0,212,255,.5)}
.eyebrow{font:700 11px ui-monospace,monospace;letter-spacing:.25em;color:#6dff9f}
.mt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mt span{font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:2px 12px;color:var(--ice);background:#071220}
.cta{margin-top:16px}
.cta .go{background:linear-gradient(90deg,#0a7aa0,#00d4ff);color:#031018;font-weight:700;border:0;padding:11px 24px;box-shadow:0 0 18px rgba(0,212,255,.4)}
.cta .go:hover{filter:brightness(1.15)}
.tl{border-left:2px dashed #1b4766;margin:14px 0 0 12px;padding-left:24px}
.stp{position:relative}
.stp::before{content:"";position:absolute;left:-33px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);border:2px solid #050a12}
nav .nh{display:flex;gap:12px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid var(--ln);margin-bottom:10px}
nav .nh small{display:block;color:var(--mu);font-size:12px}
.ring{flex:none;width:40px;height:40px;border-radius:50%;position:relative;background:conic-gradient(var(--ok) calc(var(--p)*1%),#12283f 0)}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--pn)}
/* audit */
.ad{border-top:1px solid #4a3d12;background:linear-gradient(135deg,#1c1706,#0a1a16);padding:12px 14px}
.adh{font:700 11px ui-monospace,monospace;letter-spacing:.18em;color:#ffd166;margin-bottom:8px}
.adr{display:flex;gap:10px;align-items:flex-start;margin:7px 0}
.adl{flex:none;min-width:64px;text-align:center;font:700 11px ui-monospace,monospace;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:#ffd166;color:#201600;margin-top:2px}
.adl.ex{background:#3be39a;color:#04150e}
.adr .cb{flex:1;border:1px solid #6a5818;border-radius:8px;background:#030a0a;overflow:hidden}
.adr pre{padding:8px 12px;font-size:13px}
.adr p{padding:0;flex:1;color:#d6f5e4;max-width:none}
/* quiz polish */
.qw{background:#2a0f1a;border:1px solid #ff5c8a;color:#ffb3c6;border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600}
.qo.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qo{transition:border-color .15s,background .15s}
#bt{position:fixed;right:18px;bottom:22px;width:42px;height:42px;border-radius:50%;background:#0e3552;border:1px solid var(--ac);display:none;z-index:15;box-shadow:0 0 14px rgba(0,212,255,.4);font-size:18px}
#bt.on{display:block}
@media(max-width:820px){.ph{flex-direction:column;align-items:flex-start;gap:6px}.pn{font-size:48px}.hero h2{font-size:25px}.adr{flex-direction:column;gap:4px}.tl{margin-left:6px;padding-left:18px}.stp::before{left:-27px}}
@media(prefers-reduced-motion:reduce){main>*,.qo.bad{animation:none}}
</style>
</head>

<script>
const r=String.raw;
const P=[
{t:'Prepare the workspace',g:'Build an organised evidence folder before touching the network.',k:'pwd ends in /Desktop/kali-lab and ls shows captures, loot, notes.txt, recon, reports, scans, targets.txt.',c:[
['pwd','Print working directory. Always know where you are before creating or deleting anything.'],
['ls','List files. Add -l for permissions and sizes, -a for hidden files.'],
['cd ~/Desktop','Move to the Desktop, where the lab folder will live. The ~ is a shortcut for your home directory, and cd ~ alone takes you home from anywhere. cd .. goes up one level and cd - returns to the previous directory. Audit: run pwd. The output must end in /Desktop. If you see an error, check your spelling and capital D.'],
['mkdir kali-lab\ncd kali-lab','Create the lab folder on the Desktop, then enter it so all evidence stays in one place (mkdir -p creates nested paths). Audit: run pwd, which must end in /Desktop/kali-lab, and check that a kali-lab folder now appears on your Desktop.'],
['mkdir recon scans captures loot reports','Create several folders at once, one per type of evidence. Audit: run ls. You should see captures, loot, recon, reports and scans listed.'],
['touch notes.txt targets.txt','Create empty files, or refresh the timestamp of existing ones. Audit: run ls. notes.txt and targets.txt must now be listed (ls -l shows size 0 for empty files).'],
["echo 'scanme.nmap.org' > targets.txt",'Write text to a file. A single > overwrites, a double >> appends. This records the authorized target. Audit: run cat targets.txt. It must print scanme.nmap.org.']]},
{t:'Know your own machine',g:'Identify your address and the router you reach the world through.',k:'echo $GW prints a gateway such as 192.168.56.1.',c:[
['ip a','Show every interface. Find eth0, its state UP and the inet line (your IP and subnet). lo is the loopback interface.'],
['hostname -I','Print only your IP addresses, a quick way to grab your address.'],
['ip route','Show the routing table. The line starting with default via is your gateway, the router that forwards traffic off your network.'],
[r`GW=$(ip route | grep default | sed 's/.*via \([0-9.]*\).*/\1/')`,'Command substitution stores the output in the variable GW. Regex: .* matches anything, escaped parentheses capture a group, [0-9.]* matches digits and dots, and \\1 reuses the captured group.'],
['echo $GW','Print the saved gateway address.'],
['ip a > recon/my_ip.txt\nip route > recon/route.txt','The > operator redirects output into a file. This is how you keep evidence.']]},
{t:'Local network recon',g:'Who else is on my network, and what is my own machine exposing?',k:'arp-scan lists at least the gateway, and ss shows the ports Kali listens on.',c:[
['ping -c 4 $GW','Send exactly four ICMP echo requests and report replies, round-trip time and packet loss. Without -c it runs until Ctrl+C.'],
['sudo arp-scan --localnet > recon/arp_scan.txt','sudo runs the command as administrator, which arp-scan needs for raw sockets. It broadcasts ARP requests and lists IP, MAC and vendor of live hosts. Use on your own lab network only.'],
['cat recon/arp_scan.txt','Print the file to the screen so you can read the results.'],
['ss -tulnp','List listening sockets: t TCP, u UDP, l listening only, n numeric ports, p owning process. Shows what your machine exposes.'],
['sudo ss -tulnp > recon/listening_ports.txt','sudo reveals the process names of other users. Output is saved as evidence.'],
['netstat -tulnp','Older equivalent with the same flags. May need: sudo apt install net-tools']]},
{t:'Public intelligence',g:'Low-noise lookups: ask public databases and DNS about the target.',k:'echo $TARGET prints an IPv4 address (scanme.nmap.org is commonly 45.33.32.156).',c:[
['whois nmap.org | head -n 25','Show the registration record: registrar, dates, name servers. Query the registered domain, not the subdomain. head -n 25 keeps only the first 25 lines.'],
["whois nmap.org | grep -iE 'registrar:|creation date|name server'",'grep filters lines. -i ignores case and -E enables extended regex, where | means OR.'],
['nslookup scanme.nmap.org','Simple DNS lookup: shows the server that answered and the IP of the name.'],
['dig scanme.nmap.org','Detailed DNS tool. Read the ANSWER section, the query time and the server used.'],
['dig scanme.nmap.org +short','Print only the answer.'],
['dig nmap.org MX +short\ndig nmap.org NS +short','MX shows mail servers, NS shows name servers.'],
['TARGET=$(dig +short scanme.nmap.org | head -n 1)\necho $TARGET\necho $TARGET > recon/target_ip.txt','Store the first IP in a variable so later commands can reuse it, and save it as evidence.']]},
{t:'Reachability and path',g:'Is the target alive, and how far away is it?',k:'The first hop in the traceroute equals your gateway from Phase 1.',c:[
['ping -c 4 scanme.nmap.org','Confirm the target answers and measure latency. The TTL hints at the sender OS family: about 64 for Linux and 128 for Windows.'],
['traceroute -n scanme.nmap.org > recon/traceroute.txt','List each router on the path by sending packets with rising TTL values. -n skips reverse DNS and is faster. If missing: sudo apt install traceroute'],
['cat recon/traceroute.txt','Lines showing * * * are hops that do not answer (filtered). That is normal and is itself a finding.']]},
{t:'Port and service scanning',g:'Ask the target which doors are open. Be polite: limited ports, one run each.',k:'nmap_sv.txt lists at least ports 22 and 80 as open with service and version.',c:[
['nmap scanme.nmap.org -oN scans/nmap_basic.txt','Scan the 1000 most common TCP ports and report open, closed or filtered. -oN saves normal-format output.'],
['nmap -sV -p 22,80,9929,31337 scanme.nmap.org -oN scans/nmap_sv.txt','-sV probes open ports to identify service and version (for example Apache httpd 2.4.7). Old versions have known vulnerabilities. -p limits the scan to the listed ports.'],
['sudo nmap -A -p 22,80 scanme.nmap.org -oN scans/nmap_aggressive.txt','-A is the aggressive profile: versions, OS detection, default scripts and traceroute. OS detection needs root. It is noisy and easily detected, so use it only on authorized targets with narrow port lists.']]},
{t:'Talking to the services',g:'Scanners guess; direct requests confirm.',k:'The curl Server header and the nmap -sV result agree on the web server version.',c:[
['curl -I http://scanme.nmap.org','Request only the HTTP headers. Check the status code (200 OK) and the Server header, which leaks the web server and version.'],
['curl -s http://scanme.nmap.org | head -n 15','-s is silent mode with no progress bar. The pipe sends the page into head, so you see only 15 lines.'],
['wget -q http://scanme.nmap.org -O recon/scanme_index.html','Download the page as evidence. -q is quiet and -O sets the output file name.'],
['ls -l recon','Confirm the saved files and their sizes.'],
['nc -v -w 3 scanme.nmap.org 22','Banner grabbing with netcat: the SSH server announces its software. -v is verbose and -w 3 gives up after 3 seconds.'],
[r`echo -e 'HEAD / HTTP/1.0\r\nHost: scanme.nmap.org\r\n\r\n' | nc scanme.nmap.org 80`,'Type an HTTP request by hand. -e makes echo interpret the carriage return and line feed sequences, proving a web request is only text over a socket.']]},
{t:'Capture your own traffic',g:'Use two terminals: one listens, the other generates traffic.',k:'The first lines show your Kali IP connecting to the target IP on port 80 with the [S] flag.',c:[
['sudo tcpdump -i eth0 -nn -c 20 host scanme.nmap.org -w captures/web.pcap','Terminal 2, start first. -i picks the interface (use yours if not eth0), -nn shows raw IPs and ports, -c 20 stops after 20 packets, host filters to the target, -w writes a pcap that also opens in Wireshark.'],
['curl -sI http://scanme.nmap.org > /dev/null','Terminal 1. Run it twice to generate the traffic being captured.'],
['tcpdump -nn -r captures/web.pcap | head -n 10','-r reads the capture back. Look for the three-way handshake flags [S], [S.], [.] and then HTTP on port 80.'],
['tcpdump -nn -r captures/web.pcap | tail -n 5','The end of the capture shows the connection closing with [F.].'],
['wireshark captures/web.pcap &','Open captures/web.pcap in Wireshark (or use File > Open). In the display filter bar type tcp.port == 80 and press Enter. This matches the commands you typed to the packets: your curl request appears as a GET or HEAD over port 80, after the [S], [S.], [.] handshake.']]},
{t:'Extract the findings',g:'Turn raw output into facts with grep, sed and regular expressions.',k:'You can list every open port and every lab IP with single commands.',c:[
['cat scans/nmap_sv.txt\nhead -n 8 scans/nmap_sv.txt\ntail -n 5 scans/nmap_sv.txt','Show the whole file, its first lines and its last lines (the summary at the bottom of nmap output).'],
['grep open scans/nmap_sv.txt','Print every line containing the word open.'],
["grep -E '^[0-9]+/tcp +open' scans/nmap_sv.txt | sed 's/  */ /g'",'Regex: ^ start of line, [0-9]+ one or more digits, /tcp, one or more spaces, open. It matches only port result lines. sed then collapses runs of spaces into one.'],
["sed 's/open/OPEN/' scans/nmap_sv.txt | grep OPEN",'sed s/old/new/ substitutes text. Adding g at the end replaces every match on the line.'],
[r`grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' recon/arp_scan.txt`,'-o prints only the matching part. The pattern is 1 to 3 digits and an escaped dot, repeated 3 times, then a last group of digits: an IPv4 address.'],
["grep -c 'open' scans/nmap_basic.txt",'-c prints only the number of matching lines.'],
['cp scans/nmap_sv.txt scans/nmap_sv.bak\nmv scans/nmap_sv.bak reports/nmap_sv_evidence.txt','cp copies and leaves the original. mv moves or renames. Together they make an evidence copy and file it in reports.']]},
{t:'Decode the instructor flag',g:'Attackers hide data in base64, so analysts must recognise and decode it.',k:'The screen prints FLAG{Kali_Linux_Master}.',c:[
["echo 'RkxBR3tLYWxpX0xpbnV4X01hc3Rlcn0=' > loot/flag.b64\ncat loot/flag.b64",'The instructor hands out the encoded string. Save it in the loot folder and read it back.'],
["echo 'RkxBR3tLYWxpX0xpbnV4X01hc3Rlcn0=' | base64 --decode",'Decode it directly. The result is FLAG{Kali_Linux_Master}. Base64 is encoding, not encryption; strings ending in = are a classic clue.'],
['cat loot/flag.b64 | base64 --decode','Decode from the saved file.'],
["echo -n 'scanned by kali-lab' | base64",'Encode text. -n omits the trailing newline so the encoding is clean. Tip: make a unique flag per student with echo -n FLAG{name} piped to base64.'],
["echo 'WW91IGNhbiByZXNldCwgcmVmb2N1cywgcmVhZGp1c3QsIGFuZCByZXN0YXJ0IGFzIG1hbnkgdGltZXMgYXMgeW91IG5lZWQgdG8ga2VlcCBtb3ZpbmcgZm9yd2FyZA==' | base64 --decode",'Bonus decode: a second instructor message. Decode it and read it. It is a reminder for the whole lab.']]},
{t:'Build the final report',g:'A small script combines all earlier evidence into one report.',k:'The report shows host, IPs, open ports, HTTP headers, packet count and the decoded flag.',c:[
['touch build_report.sh\nls -l build_report.sh','Create the empty script. Permissions read -rw-r--r--, so it is not yet executable.'],
[r`cat > build_report.sh << 'EOF'
#!/bin/bash
R=reports/final_report.txt
echo '=== OPERATION COMPASS FINAL REPORT ===' > $R
echo "Analyst host: $(hostname)" >> $R
echo "Lab IP: $(hostname -I)" >> $R
echo "Gateway: $(ip route | grep default | sed 's/.*via \([0-9.]*\).*/\1/')" >> $R
echo 'Target: scanme.nmap.org' >> $R
echo "Target IP: $(dig +short scanme.nmap.org | head -n 1)" >> $R
echo '--- Open ports ---' >> $R
grep -E '^[0-9]+/tcp +open' scans/nmap_sv.txt | sed 's/  */ /g' >> $R
echo '--- HTTP headers ---' >> $R
curl -sI http://scanme.nmap.org | head -n 5 >> $R
echo '--- Packets captured ---' >> $R
tcpdump -nn -r captures/web.pcap 2>/dev/null | grep -c 'IP' >> $R
echo '--- Decoded flag ---' >> $R
cat loot/flag.b64 | base64 --decode >> $R
echo '' >> $R
echo '=== END ===' >> $R
EOF`,'Writes everything up to the EOF line into the file. The quotes around EOF stop the shell expanding variables while writing. The script reuses nearly every earlier command.'],
['chmod +x build_report.sh\nls -l build_report.sh','chmod +x adds execute permission. ls -l now shows -rwxr-xr-x.'],
['./build_report.sh\ncat reports/final_report.txt','Run the script, then read the finished report.'],
['chmod 600 reports/final_report.txt','Numeric mode: owner read and write (4+2), nobody else gets access. Reports are sensitive.'],
[r`cp reports/final_report.txt reports/final_report_client.txt
sed -i 's/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/x.x.x.x/g' reports/final_report_client.txt
mv reports/final_report_client.txt reports/FINAL_REPORT_CLIENT.txt
cat reports/FINAL_REPORT_CLIENT.txt`,'Make a client-safe copy. sed -i edits in place, and the basic-regex pattern (braces escaped) replaces every IP with x.x.x.x. mv gives the file its final name.']]},
{t:'Clean-up',g:'A professional tester removes sensitive evidence at the end and keeps only the report.',k:'ls -R shows the reports folder still holds the final report while the pcap and flag are gone.',c:[
['sudo shred -v -u -n 3 captures/web.pcap','shred overwrites the contents before deleting. -n 3 is three passes, -u removes the file afterwards and -v shows progress. sudo is needed because tcpdump ran as root and owns the file.'],
['shred -v -u -n 3 loot/flag.b64','Same wipe for the flag file you own.'],
['rm recon/scanme_index.html scans/nmap_basic.txt','rm removes only the directory entry, so data can often be recovered. Use rm -i to be asked before each deletion.'],
['ls -R','Verify what remains. Note: shred is unreliable on SSDs, journaling or snapshotted file systems and cloud disks; full-disk encryption is the real protection.']]}
];
